[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-ngram"
version = "0.1.0"
description = "Functional sparse memory writes for frozen language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "transformers>=5.5,<6", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
delta-ngram = "delta_ngram.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

